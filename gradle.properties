# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Stonecutter en Groovy : le warning est connu et accepté (script historique du projet).
dev.kikugie.stonecutter.hard_mode=true

# Mod Properties (communs à toutes les versions Minecraft)
version=0.0.46
group=com.jason54jg

# Versions communes : plugin Loom + plugin Kotlin (résolus depuis la racine).
# Les versions Minecraft/Fabric API/Mod Menu sont par version : voir versions/*/gradle.properties.
loom_version=1.17-SNAPSHOT
kotlin_version=2.4.0
