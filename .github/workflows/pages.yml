name: Build and deploy information site
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/check_site.py"
      - "scripts/check_deployed_site.py"
      - "src/main/resources/assets/autominer/textures/logo.png"
      - "gradle.properties"
      - "versions/**/gradle.properties"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/check_site.py"
      - "scripts/check_deployed_site.py"
      - "src/main/resources/assets/autominer/textures/logo.png"
      - "gradle.properties"
      - "versions/**/gradle.properties"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build bilingual static pages
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site.py --site-url "$PAGES_URL"
      - name: Check local links, assets and JavaScript
        run: |
          python scripts/check_site.py
          node --check site/assets/site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select GitHub Actions as the publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$source_type" != "workflow" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow --silent
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')" = "workflow"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_deployed_site.py "$PAGES_URL" --attempts 12
